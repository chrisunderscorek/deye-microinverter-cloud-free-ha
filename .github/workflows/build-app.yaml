name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      description: ${{ steps.meta.outputs.description }}
      image_name: ${{ steps.meta.outputs.image_name }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.meta.outputs.name }}
      registry_prefix: ${{ steps.meta.outputs.registry_prefix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Read app metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./${{ inputs.app }}

      - name: Prepare build metadata
        id: meta
        env:
          DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          NAME: ${{ fromJSON(steps.info.outputs.name) }}
          VERSION: ${{ fromJSON(steps.info.outputs.version) }}
        run: |
          echo "image_name=${IMAGE##*/}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${IMAGE%/*}" >> "${GITHUB_OUTPUT}"
          echo "description=${DESCRIPTION}" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.meta.outputs.image_name }}
          registry-prefix: ${{ steps.meta.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Build images
        id: build
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ inputs.app }}
          cosign: false
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.name }}
            org.opencontainers.image.description=${{ needs.prepare.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}
          push: ${{ inputs.publish }}

  publish:
    name: Publish ${{ inputs.app }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: ${{ inputs.publish }}
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: false
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
