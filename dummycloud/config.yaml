name: Deye Dummycloud
version: "1.1.1"
slug: deye_dummycloud
description: Local Deye Solarman cloud replacement with MQTT discovery for Home Assistant
url: https://github.com/chrisunderscorek/deye-microinverter-cloud-free-ha/tree/master/dummycloud
image: ghcr.io/chrisunderscorek/deye-dummycloud-ha
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  10000/tcp: 10000
ports_description:
  10000/tcp: Deye inverter cloud endpoint
options:
  LOGLEVEL: info
  MQTT_BROKER_URL: null
  MQTT_CHECK_CERT: true
schema:
  LOGLEVEL: list(trace|debug|info|warn|error)
  MQTT_BROKER_URL: "match(^mqtts?://.+)"
  MQTT_USERNAME: str?
  MQTT_PASSWORD: password?
  MQTT_CHECK_CERT: bool
